# ════════════════════════════════════════════════════════════
# UMIRA — Production Nginx Configuration
# ════════════════════════════════════════════════════════════
# Expected layout:
#   backend    :4000  — Fastify API
#   mobile web  static  — Flutter web build served by nginx
# ════════════════════════════════════════════════════════════

upstream umira_api {
    server backend:4000;
}

# ── HTTP → HTTPS redirect ──────────────────────────────────

server {
    listen 80;
    server_name umira.app www.umira.app;
    return 301 https://$host$request_uri;
}

# ── HTTPS server ───────────────────────────────────────────

server {
    listen 443 ssl http2;
    server_name umira.app www.umira.app;

    # ── SSL (managed by Certbot, auto-renewed) ──

    ssl_certificate     /etc/letsencrypt/live/umira.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/umira.app/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # ── Security headers ──

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ── Gzip ──

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;

    # ── Rate limiting ──

    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=static:10m rate=100r/s;

    # ── Logging ──

    access_log /var/log/nginx/umira_access.log;
    error_log  /var/log/nginx/umira_error.log warn;

    # ── API — proxy to backend ──

    location /v1/ {
        limit_req zone=api burst=50 nodelay;
        proxy_pass http://umira_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # ── Health check ──

    location /health {
        proxy_pass http://umira_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 5s;
    }

    # ── Metrics (restricted to internal network) ──

    location /metrics {
        allow   10.0.0.0/8;
        allow   172.16.0.0/12;
        allow   192.168.0.0/16;
        deny    all;
        proxy_pass http://umira_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # ── API docs ──

    location /docs {
        proxy_pass http://umira_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── Flutter web app (static files) ──

    location / {
        limit_req zone=static burst=200 nodelay;
        root   /var/www/umira;
        index  index.html;
        try_files $uri $uri/ /index.html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
